# Moodle Coolify Stack - Version: 2025-12-10-03 (Fix Traefik routing + config.php)
# Déploiement optimisé pour Coolify avec labels Traefik complets
version: '3.9'

services:
  db:
    image: mariadb:11.4
    container_name: moodle_db
    restart: unless-stopped
    command: [
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_unicode_ci",
      "--skip-character-set-client-handshake",
      "--innodb-buffer-pool-size=2G",
      "--max-connections=200",
      "--wait-timeout=600",
      "--interactive-timeout=600"
    ]
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=moodle
      - MYSQL_USER=moodle
      - MYSQL_PASSWORD=${MOODLE_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          memory: 2G
    networks:
      - moodle_net

  redis:
    image: redis:7-alpine
    container_name: moodle_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M
    networks:
      - moodle_net

  moodle:
    build: .
    container_name: moodle_app
    restart: unless-stopped
    environment:
      - MOODLE_DB_TYPE=mariadb
      - MOODLE_DB_HOST=db
      - MOODLE_DB_NAME=moodle
      - MOODLE_DB_USER=moodle
      - MOODLE_DB_PASSWORD=${MOODLE_DB_PASSWORD}
      - MOODLE_REDIS_HOST=redis
      - MOODLE_REDIS_PORT=6379
      - MOODLE_REDIS_DATABASE=0
      - MOODLE_ADMIN_USER=${MOODLE_ADMIN_USER}
      - MOODLE_ADMIN_PASS=${MOODLE_ADMIN_PASS}
      - MOODLE_ADMIN_EMAIL=${MOODLE_ADMIN_EMAIL}
      - MOODLE_WWWROOT=${DOMAIN}
      - MOODLE_SITE_NAME=${MOODLE_SITE_NAME:-École en Ligne CEREDIS}
      - LRS_ENDPOINT=${LRS_ENDPOINT}
      - LRS_USERNAME=${LRS_USERNAME}
      - LRS_PASSWORD=${LRS_PASSWORD}
      - LTI_CLIENT_ID=${LTI_CLIENT_ID}
      - LTI_CLIENT_SECRET=${LTI_CLIENT_SECRET}
      - LTI_PLATFORM_URL=${LTI_PLATFORM_URL}
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-1024M}
      - UPLOAD_MAX_SIZE=${UPLOAD_MAX_SIZE:-512M}
      - MAX_EXECUTION_TIME=${MAX_EXECUTION_TIME:-300}
      - POST_MAX_SIZE=${POST_MAX_SIZE:-512M}
      - TZ=${TIMEZONE:-UTC}
    volumes:
      - ./moodle:/var/www/html
      - moodle_data:/var/www/moodledata
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/login/index.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    labels:
      # ===== LABELS TRAEFIK ESSENTIELS (compatibles Coolify) =====
      # Activation Traefik
      - "traefik.enable=true"
      
      # Port du service (requis pour Traefik)
      - "traefik.http.services.moodle.loadbalancer.server.port=80"
      - "traefik.http.services.moodle.loadbalancer.server.scheme=http"
      
      # Configuration routeur HTTP → HTTPS (si Coolify ne le gère pas)
      - "traefik.http.routers.moodle-http.rule=Host(`ecole-en-ligne.ceredis.net`)"
      - "traefik.http.routers.moodle-http.entrypoints=web"
      - "traefik.http.routers.moodle-http.middlewares=redirect-to-https"
      
      # Configuration routeur HTTPS principal
      - "traefik.http.routers.moodle.rule=Host(`ecole-en-ligne.ceredis.net`)"
      - "traefik.http.routers.moodle.entrypoints=websecure"
      - "traefik.http.routers.moodle.tls=true"
      - "traefik.http.routers.moodle.tls.certresolver=letsencrypt"
      
      # Middleware redirection HTTPS
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
      
      # Middleware buffering pour uploads (512MB)
      - "traefik.http.middlewares.moodle-buffer.buffering.maxRequestBodyBytes=536870912"
      - "traefik.http.middlewares.moodle-buffer.buffering.memRequestBodyBytes=104857600"
      - "traefik.http.routers.moodle.middlewares=moodle-buffer"
      
      # Timeouts étendus
      - "traefik.http.services.moodle.loadbalancer.server.timeout=300s"
      - "traefik.http.services.moodle.loadbalancer.passhostheader=true"
      - "traefik.http.services.moodle.loadbalancer.responseforwarding.flushinterval=100ms"
      
      # Healthcheck Traefik
      - "traefik.http.services.moodle.loadbalancer.healthcheck.path=/login/index.php"
      - "traefik.http.services.moodle.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.services.moodle.loadbalancer.healthcheck.timeout=10s"
    deploy:
      resources:
        limits:
          cpus: '3'
          memory: 3G
        reservations:
          memory: 2G
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - moodle_net

  cron:
    build: .
    container_name: moodle_cron
    restart: unless-stopped
    environment:
      - TZ=${TIMEZONE:-UTC}
      - CRON_INTERVAL_SECONDS=${CRON_INTERVAL_SECONDS:-60}
    volumes:
      - ./moodle:/var/www/html
      - moodle_data:/var/www/moodledata
    entrypoint: >
      sh -c "while true; do
        echo '[CRON] Exécution Moodle - $(date)';
        php /var/www/html/admin/cli/cron.php;
        echo '[CRON] Terminé - Prochaine dans ${CRON_INTERVAL_SECONDS:-60}s';
        sleep ${CRON_INTERVAL_SECONDS:-60};
      done"
    depends_on:
      moodle:
        condition: service_healthy
    networks:
      - moodle_net

  backup:
    image: rclone/rclone:latest
    container_name: moodle_backup
    restart: unless-stopped
    environment:
      - RCLONE_CONFIG_DROPBOX_TYPE=dropbox
      - RCLONE_CONFIG_DROPBOX_TOKEN=${DROPBOX_TOKEN}
      - MYSQL_PASSWORD=${MOODLE_DB_PASSWORD}
      - TZ=${TIMEZONE:-UTC}
    volumes:
      - moodle_data:/data/moodle
      - db_data:/data/db
      - ./backups:/scripts
    entrypoint: >
      sh -c "while true; do
        echo '[BACKUP] Démarrage - $(date)';
        mysqldump -h db -u moodle -p${MOODLE_DB_PASSWORD} moodle > /scripts/db_backup_$(date +%Y%m%d_%H%M%S).sql 2>/dev/null;
        if [ $? -eq 0 ]; then
          echo '[BACKUP] Dump SQL réussi';
          rclone copy /data/moodle dropbox:/moodle_backups/files --progress;
          rclone copy /scripts/db_backup_*.sql dropbox:/moodle_backups/sql --progress;
          echo '[BACKUP] Terminé avec succès - $(date)';
        else
          echo '[BACKUP] Erreur dump SQL';
        fi;
        sleep 86400;
      done"
    depends_on:
      db:
        condition: service_healthy
      moodle:
        condition: service_healthy
    networks:
      - moodle_net

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  moodle_data:
    driver: local

networks:
  moodle_net:
    driver: bridge