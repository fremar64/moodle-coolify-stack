version: '3.9'

services:
  db:
    image: mariadb:11.4
    container_name: moodle_db
    restart: unless-stopped
    command: [
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_unicode_ci",
      "--skip-character-set-client-handshake",
      "--innodb-buffer-pool-size=512M"
    ]
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=moodle
      - MYSQL_USER=moodle
      - MYSQL_PASSWORD=${MOODLE_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - moodle_net

  redis:
    image: redis:7-alpine
    container_name: moodle_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - moodle_net

  moodle:
    build: .
    container_name: moodle_app
    restart: unless-stopped
    environment:
      - MOODLE_DB_TYPE=mariadb
      - MOODLE_DB_HOST=db
      - MOODLE_DB_NAME=moodle
      - MOODLE_DB_USER=moodle
      - MOODLE_DB_PASSWORD=${MOODLE_DB_PASSWORD}
      - MOODLE_REDIS_HOST=redis
      - MOODLE_REDIS_PORT=6379
      - MOODLE_REDIS_DATABASE=0
      - MOODLE_ADMIN_USER=${MOODLE_ADMIN_USER}
      - MOODLE_ADMIN_PASS=${MOODLE_ADMIN_PASS}
      - MOODLE_ADMIN_EMAIL=${MOODLE_ADMIN_EMAIL}
      - MOODLE_WWWROOT=${DOMAIN}
      - MOODLE_SITE_NAME=${MOODLE_SITE_NAME:-École en Ligne CEREDIS}
      - LRS_ENDPOINT=${LRS_ENDPOINT}
      - LRS_USERNAME=${LRS_USERNAME}
      - LRS_PASSWORD=${LRS_PASSWORD}
      - LTI_CLIENT_ID=${LTI_CLIENT_ID}
      - LTI_CLIENT_SECRET=${LTI_CLIENT_SECRET}
      - LTI_PLATFORM_URL=${LTI_PLATFORM_URL}
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-512M}
      - UPLOAD_MAX_SIZE=${UPLOAD_MAX_SIZE:-256M}
      - MAX_EXECUTION_TIME=${MAX_EXECUTION_TIME:-300}
      - TZ=${TIMEZONE:-UTC}
    volumes:
      - ./moodle:/var/www/html
      - moodle_data:/var/www/moodledata
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.moodle.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.moodle.entrypoints=websecure"
      - "traefik.http.routers.moodle.tls.certresolver=letsencrypt"
      - "traefik.http.routers.moodle.service=moodle"
      - "traefik.http.routers.moodle.middlewares=moodle-retry"
      - "traefik.http.services.moodle.loadbalancer.server.port=80"
      # Middleware retry (réessaye une requête en cas d'échec réseau transitoire)
      - "traefik.http.middlewares.moodle-retry.retry.attempts=2"
      - "traefik.http.middlewares.moodle-retry.retry.initialinterval=500ms"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - moodle_net

  cron:
    build: .
    container_name: moodle_cron
    restart: unless-stopped
    environment:
      - TZ=${TIMEZONE:-UTC}
      - CRON_INTERVAL_SECONDS=${CRON_INTERVAL_SECONDS:-60}
    volumes:
      - ./moodle:/var/www/html
      - moodle_data:/var/www/moodledata
    entrypoint: >
      sh -c "while true; do
        php /var/www/html/public/admin/cli/cron.php;
        sleep ${CRON_INTERVAL_SECONDS:-60};
      done"
    depends_on:
      moodle:
        condition: service_healthy
    networks:
      - moodle_net

  backup:
    image: rclone/rclone:latest
    container_name: moodle_backup
    restart: unless-stopped
    environment:
      - RCLONE_CONFIG_DROPBOX_TYPE=dropbox
      - RCLONE_CONFIG_DROPBOX_TOKEN=${DROPBOX_TOKEN}
      - MYSQL_PASSWORD=${MOODLE_DB_PASSWORD}
      - TZ=${TIMEZONE:-UTC}
    volumes:
      - moodle_data:/data/moodle
      - db_data:/data/db
      - ./backups:/scripts
    entrypoint: >
      sh -c "while true; do
        echo 'Backup started at $(date)';
        mysqldump -h db -u moodle -p${MOODLE_DB_PASSWORD} moodle > /scripts/db_backup.sql;
        rclone copy /data/moodle dropbox:/moodle_backups/files --progress;
        rclone copy /scripts/db_backup.sql dropbox:/moodle_backups/sql --progress;
        echo 'Backup done at $(date)';
        sleep 86400;
      done"
    depends_on:
      db:
        condition: service_healthy
      moodle:
        condition: service_healthy
    networks:
      - moodle_net

volumes:
  db_data:
  redis_data:
  moodle_data:

networks:
  moodle_net:
    driver: bridge