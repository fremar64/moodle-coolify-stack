# Moodle Coolify Stack - Version: 2025-12-10-03 (Fix Traefik routing + config.php)
# Déploiement optimisé pour Coolify avec labels Traefik complets
version: '3.9'

services:
  db:
    image: mariadb:11.4
    container_name: moodle_db
    restart: unless-stopped
    command: [
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_unicode_ci",
      "--skip-character-set-client-handshake",
      "--innodb-buffer-pool-size=2G",
      "--max-connections=200",
      "--wait-timeout=600",
      "--interactive-timeout=600"
    ]
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=moodle
      - MYSQL_USER=moodle
      - MYSQL_PASSWORD=${MOODLE_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          memory: 2G
    networks:
      - moodle_net

  redis:
    image: redis:7-alpine
    container_name: moodle_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M
    networks:
      - moodle_net

  moodle:
    build: .
    container_name: moodle_app
    restart: unless-stopped
    environment:
      - MOODLE_DB_TYPE=mariadb
      - MOODLE_DB_HOST=db
      - MOODLE_DB_NAME=moodle
      - MOODLE_DB_USER=moodle
      - MOODLE_DB_PASSWORD=${MOODLE_DB_PASSWORD}
      - MOODLE_REDIS_HOST=redis
      - MOODLE_REDIS_PORT=6379
      - MOODLE_REDIS_DATABASE=0
      - MOODLE_ADMIN_USER=${MOODLE_ADMIN_USER}
      - MOODLE_ADMIN_PASS=${MOODLE_ADMIN_PASS}
      - MOODLE_ADMIN_EMAIL=${MOODLE_ADMIN_EMAIL}
      - MOODLE_WWWROOT=${DOMAIN}
      - MOODLE_SITE_NAME=${MOODLE_SITE_NAME:-École en Ligne CEREDIS}
      - LRS_ENDPOINT=${LRS_ENDPOINT}
      - LRS_USERNAME=${LRS_USERNAME}
      - LRS_PASSWORD=${LRS_PASSWORD}
      - LTI_CLIENT_ID=${LTI_CLIENT_ID}
      - LTI_CLIENT_SECRET=${LTI_CLIENT_SECRET}
      - LTI_PLATFORM_URL=${LTI_PLATFORM_URL}
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-1024M}
      - UPLOAD_MAX_SIZE=${UPLOAD_MAX_SIZE:-512M}
      - MAX_EXECUTION_TIME=${MAX_EXECUTION_TIME:-600}
      - POST_MAX_SIZE=${POST_MAX_SIZE:-512M}
      - TZ=${TIMEZONE:-UTC}
    volumes:
      - ./moodle:/var/www/html
      - moodle_data:/var/www/moodledata
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/login/index.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    # Labels Traefik désactivés - Coolify gère le routage automatiquement via son UI.
    # Pour configurer : Coolify → Application → Settings → Domains
    #
    # Si vous gérez le routage via labels (au lieu de l'UI Coolify), vous pouvez activer
    # ce bloc et adapter le nom du service/routeur selon votre instance Traefik.
    # NOTE: éviter les serversTransport ici (a déjà causé des "no available server").
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.services.moodle.loadbalancer.server.port=80"
    #   - "traefik.http.services.moodle.loadbalancer.healthcheck.path=/login/index.php"
    #   - "traefik.http.services.moodle.loadbalancer.healthcheck.interval=30s"
    #   - "traefik.http.services.moodle.loadbalancer.healthcheck.timeout=10s"
    deploy:
      resources:
        limits:
          cpus: '3'
          memory: 3G
        reservations:
          memory: 2G
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - moodle_net

  cron:
    build: .
    container_name: moodle_cron
    restart: unless-stopped
    environment:
      - TZ=${TIMEZONE:-UTC}
      - CRON_INTERVAL_SECONDS=${CRON_INTERVAL_SECONDS:-60}
    volumes:
      - ./moodle:/var/www/html
      - moodle_data:/var/www/moodledata
    entrypoint: >
      sh -c "while true; do
        date +%s > /tmp/cron_heartbeat;
        echo '[CRON] Exécution Moodle - $(date)';
        php /var/www/html/admin/cli/cron.php;
        date +%s > /tmp/cron_heartbeat;
        echo '[CRON] Terminé - Prochaine dans ${CRON_INTERVAL_SECONDS:-60}s';
        sleep ${CRON_INTERVAL_SECONDS:-60};
      done"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/cron_heartbeat && [ $(( $(date +%s) - $(cat /tmp/cron_heartbeat) )) -lt 300 ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      moodle:
        condition: service_healthy
    networks:
      - moodle_net

  backup:
    image: rclone/rclone:latest
    container_name: moodle_backup
    restart: unless-stopped
    environment:
      - RCLONE_CONFIG_DROPBOX_TYPE=dropbox
      - RCLONE_CONFIG_DROPBOX_TOKEN=${DROPBOX_TOKEN}
      - MYSQL_PASSWORD=${MOODLE_DB_PASSWORD}
      - TZ=${TIMEZONE:-UTC}
    volumes:
      - moodle_data:/data/moodle
      - db_data:/data/db
      - ./backups:/scripts
    entrypoint: >
      sh -c "while true; do
        date +%s > /tmp/backup_heartbeat;
        echo '[BACKUP] Démarrage - $(date)';
        TS=$(date +%Y%m%d_%H%M%S);
        mysqldump \
          --single-transaction \
          --quick \
          --skip-lock-tables \
          -h db -u moodle -p${MOODLE_DB_PASSWORD} moodle \
          > /scripts/db_backup_${TS}.sql 2> /scripts/db_backup_${TS}.err;
        if [ $? -eq 0 ]; then
          echo '[BACKUP] Dump SQL réussi';
          rclone copy /data/moodle dropbox:/moodle_backups/files --progress;
          rclone copy /scripts/db_backup_*.sql dropbox:/moodle_backups/sql --progress;
          rclone copy /scripts/db_backup_*.err dropbox:/moodle_backups/sql --progress;
          echo '[BACKUP] Terminé avec succès - $(date)';
        else
          echo '[BACKUP] Erreur dump SQL';
        fi;
        date +%s > /tmp/backup_heartbeat;
        sleep 86400;
      done"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/backup_heartbeat && [ $(( $(date +%s) - $(cat /tmp/backup_heartbeat) )) -lt 90000 ]"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 2m
    depends_on:
      db:
        condition: service_healthy
      moodle:
        condition: service_healthy
    networks:
      - moodle_net

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  moodle_data:
    driver: local

networks:
  moodle_net:
    driver: bridge